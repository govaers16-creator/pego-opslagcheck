<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEGO Opslagcheck</title><style>html,body{margin:0;background:#061b42;color:#fff;font-family:Arial,sans-serif}#loading{padding:30px;text-align:center}</style></head><body><div id="loading">PEGO Opslagcheck laden…</div><script>(async()=>{try{let b='';for(let i=0;i<5;i++){const r=await fetch('https://raw.githubusercontent.com/govaers16-creator/pego-opslagcheck/main/vp'+i+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('bestand '+i);b+=await r.text()}const bytes=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const reporter=`<script>(function(){var last=0,timer=0;function measure(){try{var b=document.body;if(!b)return;var max=0,k=b.children;for(var i=0;i<k.length;i++){var r=k[i].getBoundingClientRect();max=Math.max(max,r.bottom+window.scrollY)}var h=Math.ceil(Math.max(max,b.offsetHeight));if(h>100&&Math.abs(h-last)>2){last=h;parent.postMessage({type:'pego-opslagcheck-height',height:h},'*')}}catch(e){}}function q(){clearTimeout(timer);timer=setTimeout(measure,35)}if(window.ResizeObserver){var ro=new ResizeObserver(q);ro.observe(document.documentElement);if(document.body)ro.observe(document.body)}if(window.MutationObserver)new MutationObserver(q).observe(document.documentElement,{subtree:true,childList:true,attributes:true});['click','input','change'].forEach(function(n){document.addEventListener(n,function(){q();setTimeout(measure,180)},true)});window.addEventListener('load',function(){measure();setTimeout(measure,150);setTimeout(measure,500)});window.addEventListener('resize',function(){q();setTimeout(measure,250)});window.addEventListener('message',function(e){if(e.data&&e.data.type==='pego-request-height')measure()});setTimeout(measure,50);setTimeout(measure,250);setTimeout(measure,900);setTimeout(measure,1800)})();<\/script>`;const bodyClose=html.toLowerCase().lastIndexOf('</body>');if(bodyClose>=0)html=html.slice(0,bodyClose)+reporter+html.slice(bodyClose);else html+=reporter;document.open();document.write(html);document.close()}catch(err){const el=document.getElementById('loading');if(el)el.textContent='De PEGO Opslagcheck kon niet worden geladen.';console.error(err)}})();</script></body></html>
